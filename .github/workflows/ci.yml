name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Types, tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # shared + backend (unit, MongoDB integration, HTTP e2e) + frontend
      - run: npm run check

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
