name: Release

# Runs for the tags made by `npm run release`: frontend-v1.2.3 or backend-v1.2.3.
on:
  push:
    tags: ['frontend-v*', 'backend-v*']

permissions:
  contents: write # create the GitHub release
  packages: write # push the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read app and version from the tag
        id: tag
        run: |
          app="${GITHUB_REF_NAME%%-v*}"
          version="${GITHUB_REF_NAME#*-v}"
          declared=$(node -p "require('./$app/package.json').version")
          if [ "$declared" != "$version" ]; then
            echo "::error::$app/package.json is $declared but the tag says $version"; exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/finance-app-$app" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check -w @finance/shared
      - run: npm run check -w finance-app-${{ steps.tag.outputs.app }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.tag.outputs.app }}/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.version }}
            ${{ steps.tag.outputs.image }}:latest

      - name: Release notes from the changelog
        run: |
          awk -v v="${{ steps.tag.outputs.version }}" '
            $0 ~ "^## "v" " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' "${{ steps.tag.outputs.app }}/CHANGELOG.md" > notes.md
          echo "" >> notes.md
          echo "Docker image: \`${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.version }}\`" >> notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "${{ steps.tag.outputs.app }} ${{ steps.tag.outputs.version }}" --notes-file notes.md
